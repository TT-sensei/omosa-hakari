<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ナビアンの おもさを はかろう</title>
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects.css">
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-feedback.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="start">
  <img class="start-navi n1" src="https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/web/fantasy/monsters/zako/happa-squirrel-leafy.webp" alt="" aria-hidden="true">
  <img class="start-navi n2" src="https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/web/fantasy/monsters/zako/purun-little-magic-slime.webp" alt="" aria-hidden="true">
  <img class="start-navi n3" src="https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/web/fantasy/monsters/zako/sakura-snow-puff.webp" alt="" aria-hidden="true">
  <img class="start-navi n4" src="https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/web/fantasy/monsters/zako/star-bat.webp" alt="" aria-hidden="true">
  <img class="start-navi n5" src="https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/web/fantasy/monsters/zako/rainbow-shell-snail.webp" alt="" aria-hidden="true">
  <main class="start-card">
    <div class="start-copy">
      <p class="eyebrow">さんすう・おもさ</p>
      <h1>ナビアンの<br>おもさを はかろう</h1>
      <p>はかりにのったナビアンを見て、何gか読んでみよう。</p>
    </div>
    <div class="scale-choice" aria-label="はかりを選ぶ">
      <button class="scale-card" data-max="1000"><span class="scale-number">1kg</span><span>1めもり 5g</span></button>
      <button class="scale-card" data-max="2000"><span class="scale-number">2kg</span><span>1めもり 10g</span></button>
      <button class="scale-card" data-max="4000"><span class="scale-number">4kg</span><span>1めもり 20g</span></button>
    </div>
    <p class="start-note">はかりを選ぶと、ナビアンが上皿にのります。</p>
  </main>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div>
      <h1>ナビアンの おもさを はかろう</h1>
      <p id="scaleLabel">1kgのはかり</p>
    </div>
    <div class="topbar-actions"><button id="bookBtn" class="head-btn">ナビアン図鑑</button><button id="titleBtn" class="head-btn">はかりを選びなおす</button></div>
  </header>

  <main class="lesson">
    <section class="scale-area" aria-label="上皿はかり">
      <div class="measure-stage">
        <div class="scale">
          <div class="pan-shadow"></div>
          <div class="pan">
            <div class="pan-rim"></div>
            <img id="navian" alt="はかりにのったナビアン">
          </div>
          <div class="scale-column"></div>
          <div class="scale-body">
            <div class="dial">
              <svg id="dialSvg" viewBox="0 0 620 620" aria-label="上皿はかりの目盛"></svg>
              <div id="pointer" class="pointer"><span></span></div>
              <div class="dial-center"></div>
            </div>
            <div class="scale-base"></div>
          </div>
        </div>
      </div>
    </section>

    <aside class="question" aria-label="答え">
      <p id="message" class="question-message" role="status">はかりが落ち着くまで見てみよう。</p>
      <div class="question-head">
        <span class="question-kicker">よんでみよう</span>
        <p class="question-label">ナビアンは <strong>何g</strong>かな？</p>
      </div>
      <div class="answer-row">
        <input id="answer" type="number" inputmode="numeric" min="0" step="1" aria-label="重さ">
        <span>g</span>
        <button id="answerBtn">答える</button>
      </div>
      <button id="hintBtn" class="hint-btn" type="button">ヒントを見る</button><p id="hint" class="hint hidden" aria-live="polite"></p>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <button id="nextBtn" class="next hidden">つぎのナビアン →</button>
    </aside>
  </main>
</div>

<div id="book" class="hidden" aria-label="ナビアン図鑑">
  <div class="book-panel">
    <header class="book-header">
      <div><p class="book-kicker">ナビアンの記録</p><h2>ナビアン図鑑</h2></div>
      <button id="bookClose" class="head-btn">もどる</button>
    </header>
    <p class="book-intro">測ったナビアンの重さが記録されます。同じナビアンを何度も測ると、記録が増えていくよ。</p>
    <div id="bookGrid" class="book-grid"></div>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
